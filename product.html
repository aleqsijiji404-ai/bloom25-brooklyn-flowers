<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Bloom & Co Brooklyn</title>
  <meta name="description" content="View details, select size and add to cart. Fresh flower arrangements delivered in Brooklyn, NY.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-detail { padding: 120px 0 80px; }
    .product-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .product-detail-img-wrap {
      border-radius: var(--radius-xl);
      overflow: hidden;
      aspect-ratio: 3/4;
      background: var(--stone);
      position: sticky;
      top: 100px;
      box-shadow: var(--shadow-lg);
    }
    .product-detail-img { width:100%; height:100%; object-fit:cover; }
    .product-detail-info { padding-top: 20px; }
    .product-detail-category { font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .product-detail-name { font-family:var(--font-serif); font-size:clamp(2rem,4vw,3rem); color:var(--dark); margin-bottom:16px; line-height:1.15; }
    .product-detail-stars { display:flex; gap:4px; color:var(--gold); align-items:center; margin-bottom:20px; }
    .product-detail-stars span { color:var(--text-muted); font-size:0.82rem; margin-left:8px; }
    .product-detail-price { font-size:2rem; font-weight:600; color:var(--bark); margin-bottom:24px; }
    .product-detail-desc { color:var(--text-muted); line-height:1.8; margin-bottom:32px; font-size:0.95rem; }
    .size-selector { margin-bottom:32px; }
    .size-label { font-size:0.82rem; font-weight:500; margin-bottom:12px; display:block; }
    .size-options { display:flex; gap:10px; flex-wrap:wrap; }
    .size-btn {
      padding: 10px 22px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--stone-dark);
      background: var(--white);
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
      text-align: center;
    }
    .size-btn:hover, .size-btn.active { border-color:var(--bark); background:var(--bark); color:white; }
    .size-btn .size-stems { font-size:0.72rem; color:var(--text-muted); display:block; margin-top:2px; }
    .size-btn.active .size-stems { color:rgba(255,255,255,0.7); }
    .qty-selector { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
    .qty-selector-label { font-size:0.82rem; font-weight:500; }
    .qty-controls { display:flex; align-items:center; gap:12px; }
    .product-cta { display:flex; gap:12px; margin-bottom:40px; flex-wrap:wrap; }
    .product-features { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:32px; }
    .product-feature-item {
      background: var(--stone);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display:flex; gap:10px; align-items:center;
      font-size:0.82rem; color:var(--text-muted);
    }
    .delivery-badge {
      background: var(--sage-light);
      color: #2d5e27;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      font-size:0.88rem;
      margin-bottom:28px;
      display:flex; gap:12px; align-items:center;
    }
    @media(max-width:768px){
      .product-detail-grid { grid-template-columns:1fr; gap:32px; }
      .product-detail-img-wrap { position:static; aspect-ratio:4/3; }
    }
  </style>
</head>
<body>

<nav class="navbar scrolled">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-name">Bloom & Co</span>
      <span class="nav-logo-tagline">Brooklyn's Finest Florist</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="about.html">Our Story</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <button class="cart-btn">🛒<span class="cart-badge" style="display:none">0</span></button>
      <button class="nav-hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="mobile-menu">
  <div class="mobile-menu-overlay"></div>
  <div class="mobile-menu-panel">
    <button class="mobile-menu-close">✕</button>
    <ul class="mobile-nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">Our Story</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</div>

<div class="cart-overlay"></div>
<div class="cart-sidebar">
  <div class="cart-header"><h2 class="cart-title">Your Cart</h2><button class="cart-close">✕</button></div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Subtotal</span><span class="cart-subtotal">$0</span></div>
    <div class="cart-total-row"><span>Delivery</span><span class="cart-delivery">$15</span></div>
    <div class="cart-total-row final"><span>Total</span><span class="cart-total">$0</span></div>
    <button class="btn btn-rose btn-lg cart-checkout">Checkout — Order by Phone</button>
  </div>
</div>

<section class="product-detail">
  <div class="container">
    <div class="breadcrumb" style="justify-content:flex-start;margin-bottom:32px;">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep">›</span>
      <a href="shop.html">Shop</a>
      <span class="breadcrumb-sep">›</span>
      <span id="breadcrumb-name">Product</span>
    </div>
    <div class="product-detail-grid" id="product-content">
      <div style="text-align:center;padding:80px 0;grid-column:1/-1;color:var(--text-muted)">Loading...</div>
    </div>
  </div>
</section>

<!-- Related Products -->
<section class="section" style="background:var(--stone);">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title reveal">You May Also Love</h2>
    </div>
    <div class="products-grid" id="related-grid"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border:none;padding:40px 0 20px;">
      <span>© 2026 Bloom & Co. All rights reserved.</span>
      <span>Made with 🌸 in Brooklyn, NY</span>
    </div>
  </div>
</footer>

<script src="data/products.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const product = id ? ProductsStore.getById(id) : null;

  if (!product) {
    document.getElementById('product-content').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:80px 0">
        <div style="font-size:3rem;margin-bottom:16px">🌸</div>
        <h2 style="font-family:var(--font-serif)">Product Not Found</h2>
        <a href="shop.html" class="btn btn-primary" style="margin-top:20px;display:inline-flex">Back to Shop</a>
      </div>`;
    return;
  }

  document.title = `${product.name} — Bloom & Co`;
  document.getElementById('breadcrumb-name').textContent = product.name;

  let selectedSize = product.sizes ? product.sizes[1] || product.sizes[0] : null;
  let qty = 1;

  function getPrice() {
    return selectedSize ? selectedSize.price : product.price;
  }

  function render() {
    document.getElementById('product-content').innerHTML = `
      <div class="product-detail-img-wrap reveal">
        <img src="${product.image}" alt="${product.name}" class="product-detail-img" onerror="this.src='images/roses.jpg'">
      </div>
      <div class="product-detail-info reveal reveal-delay-1">
        <div class="product-detail-category">${product.category} · ${product.occasion}</div>
        ${product.badge ? `<span class="tag tag-${product.badgeType} " style="margin-bottom:12px;">${product.badge}</span>` : ''}
        <h1 class="product-detail-name">${product.name}</h1>
        <div class="product-detail-stars">
          ${'★'.repeat(product.stars)}${'☆'.repeat(5-product.stars)}
          <span>${product.reviews} reviews</span>
        </div>

        <div class="delivery-badge">
          <span>🚚</span>
          <span>Same-day delivery in Brooklyn, NY · Order by 2 PM</span>
        </div>

        <div class="product-detail-price" id="detail-price">$${getPrice()}</div>
        <p class="product-detail-desc">${product.description}</p>

        ${product.sizes ? `
        <div class="size-selector">
          <span class="size-label">Select Size:</span>
          <div class="size-options">
            ${product.sizes.map((s, i) => `
              <button class="size-btn ${s.label === (selectedSize?.label) ? 'active' : ''}" data-idx="${i}">
                ${s.label}
                <span class="size-stems">${s.stems} · $${s.price}</span>
              </button>`).join('')}
          </div>
        </div>` : ''}

        <div class="qty-selector">
          <span class="qty-selector-label">Quantity:</span>
          <div class="qty-controls">
            <button class="qty-btn" id="qty-dec">−</button>
            <span class="qty-num" id="qty-display">${qty}</span>
            <button class="qty-btn" id="qty-inc">+</button>
          </div>
        </div>

        <div class="product-cta">
          <button class="btn btn-primary btn-lg" id="add-cart-btn" style="flex:1;">🛒 Add to Cart</button>
          <button class="btn btn-ghost btn-icon" id="wish-btn" title="Add to wishlist">
            ${WishlistStore.has(product.id) ? '❤️' : '🤍'}
          </button>
        </div>

        <div class="product-features">
          <div class="product-feature-item">🌿 Farm-fresh flowers</div>
          <div class="product-feature-item">📍 Brooklyn delivery</div>
          <div class="product-feature-item">✂️ Hand-arranged</div>
          <div class="product-feature-item">♻️ Eco packaging</div>
        </div>
      </div>`;

    // Size buttons
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize = product.sizes[parseInt(btn.dataset.idx)];
        document.getElementById('detail-price').textContent = `$${getPrice()}`;
      });
    });

    // Qty
    document.getElementById('qty-dec')?.addEventListener('click', () => {
      if (qty > 1) { qty--; document.getElementById('qty-display').textContent = qty; }
    });
    document.getElementById('qty-inc')?.addEventListener('click', () => {
      qty++;
      document.getElementById('qty-display').textContent = qty;
    });

    // Add to cart
    document.getElementById('add-cart-btn')?.addEventListener('click', () => {
      for (let i = 0; i < qty; i++) CartStore.add(product.id, 1, selectedSize);
      showToast(`${product.name} added to cart! 🌸`);
      document.getElementById('add-cart-btn').innerHTML = '✓ Added to Cart!';
      document.getElementById('add-cart-btn').style.background = 'var(--sage)';
      setTimeout(() => {
        document.getElementById('add-cart-btn').innerHTML = '🛒 Add to Cart';
        document.getElementById('add-cart-btn').style.background = '';
      }, 2000);
    });

    // Wishlist
    document.getElementById('wish-btn')?.addEventListener('click', () => {
      const added = WishlistStore.toggle(product.id);
      document.getElementById('wish-btn').textContent = added ? '❤️' : '🤍';
      showToast(added ? 'Added to wishlist 🌸' : 'Removed from wishlist');
    });
  }

  render();

  // Related products
  const related = ProductsStore.getAll()
    .filter(p => p.id !== product.id && (p.occasion === product.occasion || p.category === product.category) && p.available)
    .slice(0, 4);
  const relatedGrid = document.getElementById('related-grid');
  if (relatedGrid && related.length > 0) renderProducts(relatedGrid, related);
  else if (relatedGrid) relatedGrid.parentElement.style.display = 'none';
});
</script>
</body>
</html>
